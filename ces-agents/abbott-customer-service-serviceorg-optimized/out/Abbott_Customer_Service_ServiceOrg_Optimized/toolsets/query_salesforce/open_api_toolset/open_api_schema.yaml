openapi: "3.0.3"
info:
  title: "Salesforce customer lookups (Apex)"
  version: "1.0.0"
servers:
  - url: "$env_var"
paths:
  "/services/apexrest/voiceagent/query":
    get:
      operationId: run_query
      summary: "Runs one of two fixed lookups: an order by its number, or contacts by the last four digits of a phone. Not for direct use by the agent."
      description: "Runs one of two fixed lookups: an order by its number, or contacts by the last four digits of a phone. Not for direct use by the agent."
      parameters:
        - name: q
          in: query
          required: true
          description: "One of the two fixed lookups, built by the Python tools."
          schema:
            type: string
            pattern: "^(SELECT [A-Za-z0-9_., ]+ FROM Order WHERE OrderNumber = '[0-9]{1,8}' LIMIT 1|SELECT [A-Za-z0-9_., ]+ FROM Contact WHERE AccountId != null AND \\(Phone LIKE '%[0-9]{4}' OR MobilePhone LIKE '%[0-9]{4}'\\) LIMIT [0-9]{1,2})$"
      responses:
        "200":
          description: Result
          content:
            "application/json":
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          type: string
                        OrderNumber:
                          type: string
                        Status:
                          type: string
                        EffectiveDate:
                          type: string
                        EndDate:
                          type: string
                        TotalAmount:
                          type: number
                        ShippingStreet:
                          type: string
                        ShippingCity:
                          type: string
                        ShippingState:
                          type: string
                        ShippingPostalCode:
                          type: string
                        ShippingCountry:
                          type: string
                        FirstName:
                          type: string
                        Email:
                          type: string
                        AccountId:
                          type: string
                        Phone:
                          type: string
                        MobilePhone:
                          type: string
        default:
          description: "Salesforce returned an error"
  "/services/apexrest/voiceagent/order/{id}":
    patch:
      operationId: update_order_address
      summary: "Changes the shipping address of one order. Used only by the update_shipping_address tool."
      description: "Changes the shipping address of one order. Used only by the update_shipping_address tool."
      parameters:
        - name: id
          in: path
          required: true
          description: "Salesforce Id of the order"
          schema:
            type: string
      responses:
        "204":
          description: Result
        default:
          description: "Salesforce returned an error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                ShippingStreet:
                  type: string
                ShippingCity:
                  type: string
                ShippingState:
                  type: string
                ShippingPostalCode:
                  type: string
                ShippingCountry:
                  type: string
              additionalProperties: false
  "/services/data/v68.0/sobjects/Chat_Conversation__c/Conversation_Identifier__c/{session_id}":
    patch:
      operationId: save_transcript
      summary: "Creates or updates the chat conversation record for one call. Used only by the save_transcript Python tool."
      description: "Creates or updates the chat conversation record for one call. Used only by the save_transcript Python tool."
      parameters:
        - name: session_id
          in: path
          required: true
          description: "Value of Conversation_Identifier__c that identifies the record"
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                Transcript__c:
                  type: string
                  description: "Caller and agent turns"
                Start_Timestamp__c:
                  type: string
                  description: "ISO 8601 date time"
                End_Timestamp__c:
                  type: string
                  description: "ISO 8601 date time"
                Closed_At__c:
                  type: string
                  description: "ISO 8601 date time"
                Last_Message_At__c:
                  type: string
                  description: "ISO 8601 date time"
                Message_Count__c:
                  type: number
                Conversation_Status__c:
                  type: string
                  enum:
                    - Open
                    - Closed
                Has_Human_Agent__c:
                  type: boolean
                Voice_Agent_Name__c:
                  type: string
                  description: "Which voice agent made this call (Baseline or Optimized)"
              additionalProperties: false
      responses:
        "201":
          description: Created
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                  success:
                    type: boolean
        "204":
          description: Updated
        default:
          description: "Salesforce returned an error"
