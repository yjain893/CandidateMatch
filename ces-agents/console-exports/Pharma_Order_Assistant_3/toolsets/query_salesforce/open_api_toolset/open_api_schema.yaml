openapi: 3.0.3
info:
  title: Salesforce customer lookups
  version: 1.0.0
servers:
- url: $env_var
paths:
  /query:
    get:
      operationId: find_order
      summary: 'Runs the two fixed lookups used by the Python tools: an order by its
        number, and the contacts whose phone ends with four given digits. Not for
        direct use by the agent.'
      description: 'Runs the two fixed lookups used by the Python tools: an order
        by its number, and the contacts whose phone ends with four given digits. Not
        for direct use by the agent.'
      parameters:
      - name: q
        in: query
        required: true
        description: 'One of the two fixed lookups, built by the Python tools: an
          order by number, or contacts by the last four digits of a phone.'
        schema:
          type: string
          pattern: ^(SELECT [A-Za-z0-9_., ]+ FROM Order WHERE OrderNumber = '[0-9]{1,8}'
            LIMIT 1|SELECT [A-Za-z0-9_., ]+ FROM Contact WHERE AccountId != null AND
            \(Phone LIKE '%[0-9]{4}' OR MobilePhone LIKE '%[0-9]{4}'\) LIMIT [0-9]{1,2})$
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalSize:
                    type: integer
                  done:
                    type: boolean
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          type: string
                        OrderNumber:
                          type: string
                        Status:
                          type: string
                        EffectiveDate:
                          type: string
                        EndDate:
                          type: string
                        TotalAmount:
                          type: number
                        ShippingStreet:
                          type: string
                        ShippingCity:
                          type: string
                        ShippingState:
                          type: string
                        ShippingPostalCode:
                          type: string
                        ShippingCountry:
                          type: string
                        FirstName:
                          type: string
                        Email:
                          type: string
                        AccountId:
                          type: string
                        Phone:
                          type: string
                        MobilePhone:
                          type: string
        default:
          description: Salesforce returned an error
  /sobjects/Order/{id}:
    patch:
      operationId: update_order_address
      summary: Changes the shipping address of one order. Used only by the update_shipping_address
        tool.
      description: Changes the shipping address of one order. Used only by the update_shipping_address
        tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ShippingStreet:
                  type: string
                  description: Street and number
                ShippingCity:
                  type: string
                ShippingState:
                  type: string
                ShippingPostalCode:
                  type: string
                ShippingCountry:
                  type: string
              additionalProperties: false
      parameters:
      - name: id
        in: path
        required: true
        description: Salesforce record Id
        schema:
          type: string
          pattern: ^[a-zA-Z0-9]{15,18}$
      responses:
        '204':
          description: Updated
        default:
          description: Salesforce returned an error
  /sobjects/Voice_Call_Transcript__c/Session_Id__c/{session_id}:
    patch:
      operationId: save_transcript
      summary: Creates or updates the transcript row for one call. Used only by the
        save_transcript Python tool.
      description: Creates or updates the transcript row for one call. Used only by
        the save_transcript Python tool.
      parameters:
      - name: session_id
        in: path
        required: true
        description: Value of Session_Id__c that identifies the record
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Transcript__c:
                  type: string
                  description: Caller and agent turns
                Started_At__c:
                  type: string
                  description: ISO 8601 date time
                Ended_At__c:
                  type: string
                  description: ISO 8601 date time
                Duration_Seconds__c:
                  type: number
                Turn_Count__c:
                  type: number
                Outcome__c:
                  type: string
                  enum:
                  - Completed
                  - Escalated
                  - Verification failed
                  - System error
                  - Unknown
                Caller_Verified__c:
                  type: boolean
                Agent_Name__c:
                  type: string
                Order__c:
                  type: string
                  description: Salesforce Order Id
                Account__c:
                  type: string
                  description: Salesforce Account Id
              additionalProperties: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  success:
                    type: boolean
        '204':
          description: Updated
        default:
          description: Salesforce returned an error
